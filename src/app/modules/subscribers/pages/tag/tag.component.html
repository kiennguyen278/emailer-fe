<nz-card nzTitle="Quản lý Tag" [nzSize]="'small'">
  <button nz-button nzType="primary" (click)="showCreateModal()">+ Thêm Tag</button>
  <nz-table [nzData]="tags" [nzLoading]="isLoading" [nzBordered]="true" class="mt-3">
    <thead>
    <tr>
      <th>ID</th>
      <th>Tên Tag</th>
      <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let tag of tags">
      <td>{{ tag.id }}</td>
      <td>{{ tag.name }}</td>
      <td>
        <a (click)="showEditModal(tag)">Sửa</a>
        <span class="mx-2">|</span>
        <a (click)="confirmDelete(tag)">Xoá</a>
      </td>
    </tr>
    </tbody>
  </nz-table>
</nz-card>



<ng-template #modalEditTag>
  <ng-container [formGroup]="tagForm" (ngSubmit)="handleOk()">
    <div>
      <label>Tên Tag:</label>
      <app-form-control>
        <app-input formControlName="name"></app-input>
      </app-form-control>
    </div>
    <div class="btn-group text-center mt-3">
      <button nz-button nzType="default" (click)="handleCancel()">Cancel</button>
      <button nz-button
              nzType="primary"
              (click)="handleOk()"
              [nzLoading]="isLoading"
              type="submit"
              class="ml-3"
      >Save</button>
    </div>
  </ng-container>
</ng-template>
