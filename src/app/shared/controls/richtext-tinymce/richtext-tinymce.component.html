<div class="relative">
  <div class="text-sm text-gray-600">
      <div class="flex justify-between items-center mb-2">
        <div>🔖 Chèn Placeholder:</div>
        <div>
          <ng-container *ngIf="extraTpl">
            <ng-container *ngTemplateOutlet="extraTpl"></ng-container>
          </ng-container>

          <button
            type="button"
            class="px-2 py-1 bg-gray-100 hover:bg-gray-200 rounded ml-2"
            (click)="showPreview()">
            Xem trước
          </button>
        </div>

      </div>

      <div>
        <button
          type="button"
          class="px-2 py-1 mb-2 bg-gray-100 hover:bg-gray-200 rounded"
          (click)="insertPlaceholder('{{contact.first_name}}')">
          Tên
        </button>

        <button
          type="button"
          class="px-2 py-1 mb-2 ml-2 bg-gray-100 hover:bg-gray-200 rounded"
          (click)="insertPlaceholder('{{subscriber.first_name}}')">
          Tên Lead
        </button>

        <button
          type="button"
          class="px-2 py-1 mb-2 ml-2 bg-gray-100 hover:bg-gray-200 rounded"
          (click)="insertPlaceholder('{{user.brand_model_name}}')">
          Business Model
        </button>

        <button
          type="button"
          class="px-2 py-1 mb-2 ml-2 bg-gray-100 hover:bg-gray-200 rounded"
          (click)="insertPlaceholder('{{user.business_name}}')">
          Business Name
        </button>

        <button
          type="button"
          class="px-2 py-1 mb-2 ml-2 bg-gray-100 hover:bg-gray-200 rounded"
          (click)="insertPlaceholder('{{user.business_domain}}')">
          Business Domain
        </button>

        <button
          type="button"
          class="px-2 py-1 mb-2 ml-2 bg-gray-100 hover:bg-gray-200 rounded"
          (click)="insertPlaceholder('{{user.phone}}')">
          Zalo
        </button>

        <button
          type="button"
          class="px-2 py-1 mb-2 ml-2 bg-gray-100 hover:bg-gray-200 rounded"
          (click)="insertPlaceholder('{{user.facebook_url}}')">
          Facebook
        </button>

        <button
          type="button"
          class="px-2 py-1 mb-2 ml-2 bg-gray-100 hover:bg-gray-200 rounded"
          (click)="insertPlaceholder('{{user.webinar_url}}')">
          Webinar
        </button>

        <button
          type="button"
          class="px-2 py-1 mb-2 ml-2 bg-gray-100 hover:bg-gray-200 rounded"
          (click)="insertPlaceholder('{{unsubscribe_link}}')">
          Unsubscribe
        </button>
      </div>

  </div>

  <editor
    [(ngModel)]="value"
    (ngModelChange)="onChange($event)"
    [disabled]="disabled"
    [init]="tinyConfig"
  ></editor>
</div>



<ng-template #preview>
  <iframe [srcdoc]="contentPreviewHTML" width="100%;" height="100%"></iframe>
</ng-template>
