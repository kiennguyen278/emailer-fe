<div class="relative">
  <quill-editor
    class="editor tool"
    [modules]="moduleQuill"
    nz-input
    nzAutosize=""
    placeholder="{{ placeholder }}"
    [(ngModel)]="value"
    (ngModelChange)="onChange($event)"
    [maxlength]="maxLength"
    [disabled]="disabled"
  ></quill-editor>
</div>
