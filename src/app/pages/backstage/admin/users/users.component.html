<nz-card nzTitle="Quản lý Users" [nzSize]="'small'" [nzExtra]="extraTemplate">
  <ng-template #extraTemplate>
    <button nz-button nzType="primary" (click)="showCreateModal()">+ Thêm User</button>
  </ng-template>

  <!-- Bộ lọc -->

  <!-- Danh sách users -->
  <div class="table-list pt-3 flex justify-center">
    <div class="w-full]">
      <app-table
        [columns]="columns"
        [items]="users"
        [showPagination]="true"
      >
        <ng-template [appCellTemplate]="'actions'" let-item>
          <button nz-button nzType="text" (click)="showEditModal(item)">
            <i nz-icon nzType="edit" nzTooltipTitle="Sửa user"></i>
          </button>
        </ng-template>
      </app-table>
    </div>
  </div>
</nz-card>


<!-- Modal tạo/sửa -->

<!-- Modal tạo/sửa -->
<nz-modal
  [(nzVisible)]="isModalVisible"
  [nzTitle]="modalTitle"
  (nzOnCancel)="closeModal()"
  [nzFooter]="null"
>
  <form [formGroup]="userForm" (ngSubmit)="submitUserForm()">
    <!-- Email -->
    <div class="mb-3">
      <label>Email:</label>
      <app-form-control>
        <app-input formControlName="email" placeholder="Nhập email user" />
      </app-form-control>
    </div>

    <!-- Chỉ hiển thị khi EDIT -->
    <ng-container *ngIf="isEditMode">
      <!-- Trạng thái -->

      <!-- Thông tin doanh nghiệp -->
      <div class="mb-3 mt-4">
        <label class="font-semibold">Thông tin doanh nghiệp</label>
      </div>

      <div formGroupName="businessInfo">
        <div class="mb-3">
          <label>Tên doanh nghiệp:</label>
          <app-form-control>
            <app-input formControlName="businessName"></app-input>
          </app-form-control>
        </div>

        <div class="mb-3">
          <label>Email doanh nghiệp:</label>
          <app-form-control>
            <app-input formControlName="businessEmail"></app-input>
          </app-form-control>
        </div>

        <div class="mb-3">
          <label>Domain:</label>
          <app-form-control>
            <app-input formControlName="businessDomain"></app-input>
          </app-form-control>
        </div>

        <div class="mb-3">
          <label>Trạng thái xác minh:</label>
          <app-form-control>
            <div class="pl-2 pt-1 text-gray-700">
              {{ userForm.get('businessInfo.isVerified')?.value ? 'Đã xác minh' : 'Chưa xác minh' }}
            </div>
          </app-form-control>
        </div>

        <div class="mb-3">
          <label>Sử dụng Custom SMTP:</label>
        </div>
      </div>
    </ng-container>

    <!-- Nút hành động -->
    <div class="btn-group text-center mt-4">
      <button nz-button nzType="default" (click)="closeModal()">Hủy</button>
      <button
        nz-button
        nzType="primary"
        [nzLoading]="isSaving"
        type="submit"
        class="ml-3"
      >
        Lưu
      </button>
    </div>
  </form>
</nz-modal>
