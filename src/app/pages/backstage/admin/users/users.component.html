<nz-card nzTitle="Quản lý Users" [nzSize]="'small'" [nzExtra]="extraTemplate">
  <ng-template #extraTemplate>
    <button nz-button type="button" nzType="primary" (click)="showCreateModal()">+ Thêm mới</button>
  </ng-template>

  <!-- 🔍 FORM TÌM KIẾM -->
  <form [formGroup]="formSearch" (ngSubmit)="onSearch()" class="search-form mb-3">
    <div nz-row [nzGutter]="12">
      <div nz-col [nzSpan]="4">
        <label>Status:</label>
        <app-form-control>
          <app-select formControlName="status" [options]="statusOptions"></app-select>
        </app-form-control>
      </div>
      <div nz-col [nzSpan]="4">
        <label>Email:</label>
        <app-form-control>
          <app-input formControlName="email" placeholder="Tìm theo email" [allowClear]="true"></app-input>
        </app-form-control>
      </div>
      <div nz-col [nzSpan]="4">
        <div class="btn-group mt-4">
          <button nz-button nzType="primary" [nzLoading]="loading$ | async" type="submit">Tìm kiếm</button>
        </div>
      </div>
    </div>
  </form>

  <!-- 📋 BẢNG DANH SÁCH USERS -->
  <app-table
    [columns]="columns"
    [items]="pagedItems"
    [scrollX]="'800px'"
    [loading]="loading$ | async"
    (queryParams)="onQueryParams($event)"
  >
    <ng-template [appCellTemplate]="'actions'" let-item>
      <button nz-button nzType="text" (click)="showViewModal(item)">
        <i nz-icon nzType="eye" nz-tooltip nzTooltipTitle="Xem chi tiết"></i>
      </button>
    </ng-template>
  </app-table>
</nz-card>

<ng-template #modalUserForm>
  <form [formGroup]="formUser" (ngSubmit)="saveUser()" class="px-4 py-2">
    <div nz-row [nzGutter]="16">
      <div nz-col [nzSpan]="24">
        <label for="email" class="block font-medium mb-1">Email:</label>
        <app-form-control>
          <app-input formControlName="email" id="email" placeholder="Nhập địa chỉ email" class="w-full" />
          <ng-container *ngIf="formUser.get('email')?.touched && formUser.get('email')?.invalid">
            <div class="text-red-500 text-xs mt-1" *ngIf="formUser.get('email')?.errors?.['required']">
              Email là bắt buộc
            </div>
            <div class="text-red-500 text-xs mt-1" *ngIf="formUser.get('email')?.errors?.['email']">
              Email không đúng định dạng
            </div>
          </ng-container>
        </app-form-control>
      </div>
    </div>
    <div class="text-center mt-4">
      <button nz-button nzType="primary" type="submit">Lưu</button>
    </div>
  </form>
</ng-template>

<!-- 📌 MODAL CHI TIẾT USER VỚI 2 TAB: INFO VÀ BUSINESS -->
<nz-modal
  [(nzVisible)]="isViewModalVisible"
  [nzTitle]="'Chi tiết người dùng'"
  [nzWidth]="800"
  (nzOnCancel)="closeViewModal()"
  [nzFooter]="null"
>
  <nz-tabset [(nzSelectedIndex)]="activeTabIndex">
    <nz-tab nzTitle="Info">
      <div *ngIf="selectedUser">
        <p>Email: {{ selectedUser.email }}</p>
        <p>Trạng thái:
          <nz-tag [nzColor]="selectedUser.status === 'ACTIVE' ? 'green' : 'red'">{{ selectedUser.status }}</nz-tag>
          <button nz-button nzSize="small" (click)="toggleUserStatus()">Toggle</button>
        </p>
      </div>
    </nz-tab>

    <nz-tab nzTitle="Business Info">
      <form *ngIf="selectedUser" class="mt-2 px-2">
        <label>Tên doanh nghiệp:</label>
        <input nz-input [(ngModel)]="selectedUser.businessName" name="bizName" class="mb-2" />
        <label>Email doanh nghiệp:</label>
        <input nz-input [(ngModel)]="selectedUser.businessEmail" name="bizEmail" class="mb-2" />
        <label>Domain:</label>
        <input nz-input [(ngModel)]="selectedUser.domain" name="bizDomain" class="mb-2" />

        <label>Trạng thái doanh nghiệp:</label>
        <select [(ngModel)]="selectedUser.statusBusinessEmail" name="bizStatus" nz-select class="mb-3">
          <option value="VERIFIED">VERIFIED</option>
          <option value="UNVERIFIED">UNVERIFIED</option>
        </select>

        <div class="mt-2">
          <button nz-button nzType="primary" (click)="updateBusinessInfo()">Cập nhật thông tin</button>
          <button nz-button nzType="default" (click)="updateBusinessStatus()" class="ml-2">Cập nhật trạng thái</button>
        </div>
      </form>
    </nz-tab>

    <nz-tab nzTitle="SMTP Info">
      Nothing
    </nz-tab>

  </nz-tabset>
</nz-modal>
