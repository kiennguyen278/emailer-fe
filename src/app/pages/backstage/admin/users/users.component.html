<nz-card nzTitle="Quản lý Users" [nzSize]="'small'" [nzExtra]="extraTemplate">
  <ng-template #extraTemplate>
    <button nz-button type="button" nzType="primary" (click)="showCreateModal()">+ Thêm mới</button>
  </ng-template>

  <!-- 🔍 FORM TÌM KIẾM -->
  <form [formGroup]="formSearch" (ngSubmit)="onSearch()" class="search-form mb-3">
    <div nz-row [nzGutter]="12">
      <div nz-col [nzSpan]="3">
        <div class="mb-2">Status:</div>
        <app-form-control>
          <app-select formControlName="status"
                      [allowClear]="true"
                      (ngModelChange)="onSearch()"
                      [options]="statusOptions"></app-select>
        </app-form-control>
      </div>
      <div nz-col [nzSpan]="5">
        <div class="mb-2">Email:</div>
        <app-form-control>
          <app-input formControlName="email" placeholder="Tìm theo email" [allowClear]="true"></app-input>
        </app-form-control>
      </div>
      <div nz-col [nzSpan]="4">
          <div class="mb-2">&nbsp;</div>
          <button nz-button nzType="primary" [nzLoading]="loading" type="submit">Tìm kiếm</button>
      </div>
    </div>
  </form>

  <!-- 📋 BẢNG DANH SÁCH USERS -->
  <app-table
    [columns]="columns"
    [items]="pagedItems"
    [scrollX]="'800px'"
    [loading]="loading"
    (queryParams)="onQueryParams($event)"
  >

    <ng-template [appCellTemplate]="'status'" let-item>
      <app-switch [ngModel]="item.activeStatus"
                  [checkedLabel]="item.status"
                  [unCheckedLabel]="item.status"
                  (switchChange)="confirmSwitchStatus(item)"></app-switch>
    </ng-template>

    <ng-template [appCellTemplate]="'createdAt'" let-item>
      {{item.createdAt | date: DATE_TIME_FORMAT}}
    </ng-template>

    <ng-template [appCellTemplate]="'actions'" let-item>
      <button nz-button nzType="text" nzShape="circle" (click)="showViewModal(item)">
        <i nz-icon nzType="eye" nz-tooltip nzTooltipTitle="Xem chi tiết"></i>
      </button>
    </ng-template>

  </app-table>
</nz-card>

<ng-template #modalUserForm>
  <form [formGroup]="formUser" (ngSubmit)="saveUser()">

    <div class="flex">
    </div>
    <div nz-row [nzGutter]="16">
      <div nz-col [nzSpan]="24">
        <label class="block font-medium mb-1">Email:</label>
        <app-form-control>
          <app-input formControlName="email" placeholder="Nhập địa chỉ email" class="w-full" />
        </app-form-control>
      </div>
    </div>
    <div class="text-center mt-4">
      <button nz-button nzType="default" class="mr-2" (click)="closeUserModal()" type="button">Hủy</button>
      <button nz-button nzType="primary" type="submit">Lưu</button>
    </div>
  </form>
</ng-template>
