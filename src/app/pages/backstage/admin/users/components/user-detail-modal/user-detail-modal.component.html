  <nz-tabset [(nzSelectedIndex)]="activeTabIndex">

    <nz-tab nzTitle="Business Info">

      <form [formGroup]="form" (ngSubmit)="saveBusinessInfo()">
        <div class="field-item mb-3 flex">
          <div class="flex-[170px_0_0] text-right pr-3 leading-[22px] p-[5px]">Tên doanh nghiệp (<span class="text-[#f00]">*</span>)</div>
          <div class="flex-[1_0_0]">
            <app-form-control>
              <app-input formControlName="businessName"
                         [allowClear]="true"
                         placeholder="Tên doanh nghiệp"></app-input>
            </app-form-control>
          </div>
        </div>


        <div class="mb-3 flex">
          <div class="flex-[170px_0_0] text-right pr-3 leading-[22px] p-[5px]">Email doanh nghiệp (<span class="text-[#f00]">*</span>)</div>
          <div class="flex-[1_0_0]">
            <app-form-control>
              <app-input formControlName="businessEmail"
                         [allowClear]="true"
                         placeholder="Email doanh nghiệp"></app-input>
            </app-form-control>
          </div>
        </div>

        <div class="mb-3 flex">
          <div class="flex-[170px_0_0] text-right pr-3 leading-[22px] p-[5px]">Domain</div>
          <div class="flex-[1_0_0]">
            <app-form-control>
              <app-input formControlName="businessDomain"
                         [allowClear]="true"
                         placeholder="Domain"></app-input>
            </app-form-control>
          </div>
        </div>

        <div class="mb-3 flex">
          <div class="flex flex-[1_0_0]">
            <div class="flex-[170px_0_0] text-right pr-3 leading-[22px] p-[5px]">Trạng thái</div>
            <div class="flex-[1_0_0]">
              <app-form-control>
                <app-switch
                  formControlName="statusBusinessEmail"
                  (switchChange)="form.controls['statusBusinessEmail'].patchValue(!$event)"
                ></app-switch>
              </app-form-control>
            </div>
          </div>

          <div class="flex-[1_0_0]">
            <div class="btn-group text-right">
              <button nz-button type="button" nzType="default" (click)="closeModal()">Cancel</button>
              <button nz-button
                      nzType="primary"
                      type="submit"
                      class="ml-3"
              >Cập nhật thông tin</button>
            </div>
          </div>
        </div>


      </form>

    </nz-tab>

    <nz-tab nzTitle="SMTP Info">
      Nothing
    </nz-tab>

  </nz-tabset>
