<nz-card nzTitle="Tổng quan Subscriber" [nzSize]="'small'" class="mb-4">
  <div nz-row [nzGutter]="16">
    <div nz-col [nzSpan]="4">
      <div class="summary-box">
        <div class="summary-title">Tổng số</div>
        <div class="summary-value text-blue-600">{{ summary.total }}</div>
      </div>
    </div>
    <div nz-col [nzSpan]="4">
      <div class="summary-box">
        <div class="summary-title">Open rate</div>
        <div class="summary-value text-green-600">{{ summary.openRate }}%</div>
      </div>
    </div>
    <div nz-col [nzSpan]="4">
      <div class="summary-box">
        <div class="summary-title">Click rate</div>
        <div class="summary-value text-green-600">{{ summary.clickRate }}%</div>
      </div>
    </div>
    <div nz-col [nzSpan]="4">
      <div class="summary-box">
        <div class="summary-title">Unsubscribed</div>
        <div class="summary-value text-red-500">{{ summary.unsubscribed }}</div>
      </div>
    </div>
    <div nz-col [nzSpan]="4">
      <div class="summary-box">
        <div class="summary-title">Complain rate</div>
        <div class="summary-value text-red-500">{{ summary.complainRate }}%</div>
      </div>
    </div>
  </div>
</nz-card>


<nz-card nzTitle="Quản lý Subscriber" [nzSize]="'small'" [nzExtra]="extraTemplate">
  <ng-template #extraTemplate>
    <button nz-button type="button" nzType="primary"  (click)="showImportModal()">Import Subscriber</button>
    <button nz-button type="button" nzType="primary"
            class="ml-3" (click)="showCreateModal()">+ Thêm Subscriber</button>
  </ng-template>

  <div class="search-form">
    <form [formGroup]="formSearch" (ngSubmit)="onSearch()">
      <div nz-row [nzGutter]="12">

        <div nz-col [nzSpan]="3">
          <div class="field-item flex items-center">
            <label class="mr-2">Status:</label>
            <div class="flex-[1_0_0]">
              <app-form-control>
                <app-select formControlName="status"
                            [options]="subscriberStatusOptions$ | async"
                ></app-select>
              </app-form-control>
            </div>

          </div>
        </div>

        <div nz-col [nzSpan]="3">
          <div class="field-item flex items-center">
            <label class="mr-2">Tags:</label>
            <div class="flex-[1_0_0]">
              <app-form-control>
                <app-select formControlName="tagId"
                            [options]="tagOptions$ | async"
                ></app-select>
              </app-form-control>
            </div>

          </div>
        </div>

        <div nz-col [nzSpan]="8">
          <div class="field-item flex items-center">
            <label class="mr-2">Keyword:</label>
            <div class="flex-[1_0_0]">
              <app-form-control>
                <app-input formControlName="keyword"
                           [allowClear]="true"
                           placeholder="Tên hoặc email"></app-input>
              </app-form-control>
            </div>

          </div>
        </div>

        <div nz-col [nzSpan]="8">
          <div class="field-item">
            <div class="btn-group">
              <button nz-button
                      nzType="primary"
                      [nzLoading]="loading$ | async"
                      type="submit"
              >Search</button>
            </div>
          </div>
        </div>

      </div>

    </form>
  </div>

  <div class="table-list pt-3">
    <div class="basis-0 grow shrink">
      <app-table
        [columns]="columns"
        [items]="items"
        [scrollX]="'900px'"
        [loading]="loading$ | async"
        [showPagination]="pagination.total > 0"
        (queryParams)="onQueryParams($event)"
        [pagination]="pagination"
      >
        <ng-template [appCellTemplate]="'actions'" let-item>
          <button nz-button nzType="text" (click)="showEditModal(item)" class="cursor-pointer">
            <i nz-icon
               nzType="edit"
               nzTheme="outline"
               nz-tooltip
               nzTooltipTitle="Sửa tag"></i>
          </button>

          <button nz-button
                  nzType="text"
                  (click)="confirmDelete(item)" class="cursor-pointer ml-2">
            <i nz-icon
               nzType="delete"
               nzTheme="outline"
               nz-tooltip
               nzTooltipTitle="Xóa tag"></i>
          </button>
        </ng-template>

      </app-table>
    </div>
  </div>
</nz-card>

<ng-template #modalEditSubscriber>
  <form [formGroup]="form" (ngSubmit)="saveSubscriber()">
    <div nz-row [nzGutter]="16">

      <div nz-col [nzSpan]="12">
        <div class="field-item mb-3">
          <label>First Name:</label>
          <app-form-control>
            <app-input formControlName="firstName"></app-input>
          </app-form-control>
        </div>
      </div>

      <div nz-col [nzSpan]="12">
        <div class="field-item mb-3">
          <label>Last Name:</label>
          <app-form-control>
            <app-input formControlName="lastName"></app-input>
          </app-form-control>
        </div>
      </div>

      <div nz-col [nzSpan]="12">
        <div class="field-item mb-3">
          <label>Email:</label>
          <app-form-control>
            <app-input formControlName="email"></app-input>
          </app-form-control>
        </div>
      </div>

      <div nz-col [nzSpan]="12">
        <div class="field-item mb-3">
          <label>Tags:</label>
          <app-form-control>
            <app-select formControlName="tagIds"
            [options]="tagOptions$ | async"
            [isMulti]="true"></app-select>
          </app-form-control>
        </div>
      </div>

    </div>
    <div class="btn-group text-center">
      <button nz-button type="button" nzType="default" (click)="closeModal()">Cancel</button>
      <button nz-button
              nzType="primary"
              [nzLoading]="isLoadingSave"
              type="submit"
              class="ml-3"
      >Save</button>
    </div>
  </form>
</ng-template>

<ng-template #modalImportSubscriber>
  <form [formGroup]="formImport" (ngSubmit)="importSubscribers()">
    <div class="mb-4">
      <a href="/assets/sample-subscriber.csv" download>📄 Tải file CSV mẫu</a>
    </div>

    <div class="field-item mb-4">
      <label>Chọn file CSV:</label>
      <app-form-control>
        <input type="file" accept=".csv"
               (change)="onFileSelected($event)" />
      </app-form-control>
    </div>

    <div class="field-item mb-4">
      <label>Gắn vào Tag:</label>
      <app-form-control>
        <app-select formControlName="tagId"
                    [options]="tagOptions$ | async"></app-select>
      </app-form-control>
    </div>

    <div class="btn-group text-center mt-3">
      <button nz-button type="button" nzType="default" (click)="closeImportModal()">Cancel</button>
      <button nz-button
              nzType="primary"
              [nzLoading]="isLoadingImport"
              type="submit"
              class="ml-3"
      >Import</button>
    </div>
  </form>
</ng-template>
