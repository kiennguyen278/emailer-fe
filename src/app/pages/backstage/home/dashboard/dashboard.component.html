<div class="dashboard-wrapper">

  <!-- 1. Tăng trưởng Subscriber -->
  <nz-card nzTitle="Tăng trưởng Subscriber" [nzSize]="'small'" class="mb-4">
    <div nz-row [nzGutter]="16">
      <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="6" *ngFor="let item of subscriberGrowthItems">
        <div class="summary-box">
          <div class="summary-title">{{ item.label }}</div>
          <div class="summary-value">{{ item.count }}</div>
          <div class="summary-trend" [ngClass]="item.trend.toLowerCase()">
            Trend: {{ item.trend }}
          </div>
        </div>
      </div>
    </div>
  </nz-card>

  <!-- 2. Hiệu suất gửi email -->
  <nz-card nzTitle="Hiệu suất gửi Email" [nzSize]="'small'" class="mb-4">
    <div nz-row [nzGutter]="16">
      <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="6">
        <div class="summary-box">
          <div class="summary-title">Tổng gửi</div>
          <div class="summary-value">{{ emailPerformance.totalSent }}</div>
        </div>
      </div>
      <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="6">
        <div class="summary-box">
          <div class="summary-title">Tỷ lệ mở</div>
          <div class="summary-value">{{ emailPerformance.openRate }}%</div>
        </div>
      </div>
      <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="6">
        <div class="summary-box">
          <div class="summary-title">Tỷ lệ click</div>
          <div class="summary-value">{{ emailPerformance.clickRate }}%</div>
        </div>
      </div>
    </div>
  </nz-card>

  <!-- 3. Biểu đồ xu hướng tương tác -->
  <nz-card nzTitle="Biểu đồ xu hướng tương tác" [nzSize]="'small'" class="mb-4">
    <div echarts [options]="engagementChartOptions" class="chart-container"></div>
  </nz-card>

</div>
