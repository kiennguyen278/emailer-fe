


<div>
  <form [formGroup]="form" (ngSubmit)="saveCampaign()">

<!--    <nz-tabset>-->

<!--      &lt;!&ndash; TAB 1: DETAIL &ndash;&gt;-->
<!--      <nz-tab nzTitle="Thông tin campaign">-->
        <div nz-row [nzGutter]="10">

          <div nz-col [nzSpan]="11">
            <div class="field-item mb-3">
              <label class="mr-2">Tên campaign:</label>
              <div class="flex-[1_0_0]">
                <app-form-control>
                  <app-input formControlName="name"
                             [allowClear]="true"
                             placeholder="Tên campaign"></app-input>
                </app-form-control>
              </div>
            </div>


            <div class="field-item mb-3">
              <label class="mr-2">Subject:</label>
              <div class="flex-[1_0_0]">
                <app-form-control>
                  <app-input formControlName="subject"
                             [allowClear]="true"
                             placeholder="Subject"></app-input>
                </app-form-control>
              </div>
            </div>

            <div class="field-item mb-3">
              <label class="mr-2">Mô tả:</label>
              <div class="flex-[1_0_0]">
                <app-form-control>
                  <app-textarea formControlName="description"
                                [rows]="4"
                                [maxHeight]="'240px'"></app-textarea>
                </app-form-control>
              </div>
            </div>

            <div class="field-item mb-3">
              <label class="mr-2">Scheduled Time:</label>
              <div class="flex-[1_0_0]">
                <app-form-control>
                  <app-datepicker
                    formControlName="scheduledTime"
                    [showTime]="true"
                    [disabledDate]="disabledDate"
                    [format]="DATE_TIME_FORMAT"
                  ></app-datepicker>
                </app-form-control>
              </div>
            </div>


            <div class="field-item mb-3">
              <label class="mr-2">Tag:</label>
              <div class="flex-[1_0_0]">
                <app-form-control>
                  <app-select formControlName="tagIds"
                              [options]="tagOptions$ | async"
                              placeholder="Chọn tag"
                              [isMulti]="true"
                  ></app-select>
                </app-form-control>
              </div>
            </div>

          </div>

          <div nz-col [nzSpan]="13">
            <div class="field-item mb-3">
              <label class="mr-2">Content:</label>
              <div class="flex-[1_0_0]">

                <app-form-control>
                  <app-richtext-email
                    formControlName="htmlBody"></app-richtext-email>
                </app-form-control>

              </div>
            </div>
          </div>

        </div>
<!--      </nz-tab>-->
<!--      -->
<!--    </nz-tabset>-->


    <div class="btn-group text-right">
      <button nz-button type="button" [disabled]="isLoadingSave" nzType="default" (click)="closeModal()">Cancel</button>
      <button nz-button
              nzType="primary"
              type="submit"
              [nzLoading]="isLoadingSave"
              class="ml-3"
      >Save</button>
    </div>
  </form>
</div>
