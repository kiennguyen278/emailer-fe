


<div>
  <form [formGroup]="form" (ngSubmit)="saveTemplate()">
    <div nz-row [nzGutter]="10">

      <div nz-col [nzSpan]="18">
        <div class="field-item mb-3">
          <label class="mr-2">Tên template:</label>
          <div class="flex-[1_0_0]">
            <app-form-control>
              <app-input formControlName="name"
                         [allowClear]="true"
                         placeholder="Tên email template"></app-input>
            </app-form-control>
          </div>
        </div>
      </div>

      <div nz-col [nzSpan]="6">
        <div class="field-item mb-3">
          <label class="mr-2">Content Type:</label>
          <div class="flex-[1_0_0]">
            <app-form-control>
              <app-select formControlName="type"
                          [options]="typeContentOption"
                          (ngModelChange)="onChangeTypeContent($event)"
              ></app-select>
            </app-form-control>
          </div>

        </div>
      </div>

      <div nz-col [nzSpan]="24">
        <div class="field-item mb-3">
          <label class="mr-2">Subject:</label>
          <div class="flex-[1_0_0]">
            <app-form-control>
              <app-input formControlName="subject"
                         [allowClear]="true"
                         placeholder="Subject"></app-input>
            </app-form-control>
          </div>
        </div>
      </div>

      <div nz-col [nzSpan]="24">
        <div class="field-item mb-3">
          <label class="mr-2">Content:</label>
          <div class="flex-[1_0_0]">
            <ng-container *ngIf="form.controls['type'].value == 'HTML'; else controlArea">

              <div class="space-x-2 text-sm text-gray-600 mb-2 flex justify-between">
                <div>
                  <span>🔖 Chèn Placeholder:</span>
                  <button
                    type="button"
                    class="px-2 py-1 ml-2 bg-gray-100 hover:bg-gray-200 rounded"
                    (click)="insertPlaceholder('{{ contact.first_name }}')">
                    Tên
                  </button>
                  <button
                    type="button"
                    class="px-2 py-1 ml-2 bg-gray-100 hover:bg-gray-200 rounded"
                    (click)="insertPlaceholder('{{ contact.email }}')">
                    Email
                  </button>
                </div>

                <button
                  type="button"
                  class="px-2 py-1 bg-gray-100 hover:bg-gray-200 rounded"
                  (click)="showPreview = !showPreview">
                  {{showPreview ? "Ẩn xem trước" : "Xem trước"}}
                </button>

              </div>

              <app-form-control>
                <quill-editor
                  #quillEditor
                  formControlName="htmlBody"
                  [styles]="{height: '300px'}"
                  [modules]="moduleQuill"
                  (ngModelChange)="onChangeContent($event)"
                  class="bg-white rounded">
                </quill-editor>
              </app-form-control>
            </ng-container>

            <ng-template #controlArea>
              <app-form-control>
                <app-textarea formControlName="textBody"
                              [rows]="4"
                              [maxHeight]="'240px'"></app-textarea>
              </app-form-control>
            </ng-template>

          </div>
        </div>
      </div>

    </div>

    <div class="btn-group text-right">
      <button nz-button type="button" nzType="default" (click)="closeModal()">Cancel</button>
      <button nz-button
              nzType="primary"
              type="submit"
              class="ml-3"
      >Save</button>
    </div>
  </form>
</div>

<!-- Chèn Placeholder -->
<div *ngIf="showPreview" class="p-3 border rounded bg-gray-50 mt-4">
  <div class="text-sm font-semibold mb-2">👁️ Xem trước nội dung email:</div>
  <iframe [srcdoc]="contentPreviewHTML" width="100%;" height="auto">
<!--    <div [innerHTML]="contentPreviewHTML" class="prose max-w-none"></div>-->
  </iframe>

</div>
