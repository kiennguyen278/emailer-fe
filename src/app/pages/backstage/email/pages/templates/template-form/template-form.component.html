


<div>
  <form [formGroup]="form" (ngSubmit)="saveTemplate()">
    <div nz-row [nzGutter]="10">

      <div nz-col [nzSpan]="18">
        <div class="field-item mb-3">
          <label class="mr-2">Tên template (<span class="text-[#f00]">*</span>)</label>
          <div class="flex-[1_0_0]">
            <app-form-control>
              <app-input formControlName="name"
                         [allowClear]="true"
                         placeholder="Tên email template"></app-input>
            </app-form-control>
          </div>
        </div>
      </div>

      <div nz-col [nzSpan]="6">
        <div class="field-item mb-3">
          <label class="mr-2">Content Type</label>
          <div class="flex-[1_0_0]">
            <app-form-control>
              <app-select formControlName="type"
                          [options]="typeContentOption"
                          (ngModelChange)="onChangeTypeContent($event)"
              ></app-select>
            </app-form-control>
          </div>

        </div>
      </div>

      <div nz-col [nzSpan]="24">
        <div class="field-item mb-3">
          <label class="mr-2">Subject (<span class="text-[#f00]">*</span>)</label>
          <div class="flex-[1_0_0]">
            <app-form-control>
              <app-input formControlName="subject"
                         [allowClear]="true"
                         placeholder="Subject"></app-input>
            </app-form-control>
          </div>
        </div>
      </div>

      <div nz-col [nzSpan]="24">
        <div class="field-item mb-3">
          <label class="mr-2">Content (<span class="text-[#f00]">*</span>)</label>
          <div class="flex-[1_0_0]">
            <ng-container *ngIf="form.controls['type'].value == 'HTML'; else controlArea">

                <app-form-control>
                  <app-richtext-tinymce
                    formControlName="htmlBody"
                    [extraTpl]="extraTpl"></app-richtext-tinymce>
                </app-form-control>

                <ng-template #extraTpl>
<!--                  <button-->
<!--                    type="button"-->
<!--                    (click)="openModalSelectTemplate()"-->
<!--                    class="px-2 py-1 bg-gray-100 hover:bg-gray-200 rounded ml-2">-->
<!--                    Chọn template-->
<!--                  </button>-->
                </ng-template>

<!--                <quill-editor-->
<!--                  #quillEditor-->
<!--                  formControlName="htmlBody"-->
<!--                  [styles]="{height: '300px'}"-->
<!--                  [modules]="moduleQuill"-->
<!--                  (ngModelChange)="onChangeContent($event)"-->
<!--                  class="bg-white rounded">-->
<!--                </quill-editor>-->
            </ng-container>

            <ng-template #controlArea>
              <app-form-control>
                <app-textarea formControlName="textBody"
                              [rows]="15"
                              [maxHeight]="'240px'"></app-textarea>
              </app-form-control>
            </ng-template>

          </div>
        </div>
      </div>

    </div>

    <div class="btn-group text-right">
      <button nz-button type="button" nzType="default" (click)="closeModal()">Cancel</button>
      <button nz-button
              nzType="primary"
              type="submit"
              class="ml-3"
      >Save</button>
    </div>
  </form>
</div>
