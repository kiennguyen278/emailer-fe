<div class="settings-wrapper space-y-6 overflow-auto max-h-screen p-6 bg-white rounded shadow">
  <nz-tabset  [(nzSelectedIndex)]="activeTabIndex" (nzSelectedIndexChange)="onTabChange($event)">

    <!-- TAB 1: Thông tin doanh nghiệp -->
    <nz-tab nzTitle="Doanh nghiệp">
      <nz-card nzTitle="Thông tin doanh nghiệp" [nzSize]="'default'">
        <form [formGroup]="businessForm" nz-form [nzLayout]="'vertical'" >
          <nz-row [nzGutter]="16">
            <nz-col [nzSpan]="12">
              <nz-form-item>
                <nz-form-label>Tên doanh nghiệp</nz-form-label>
                <nz-form-control>
                  <input
                    nz-input
                    formControlName="businessName"
                    placeholder="Nhập tên doanh nghiệp"/>
                </nz-form-control>
              </nz-form-item>
            </nz-col>
            <nz-col [nzSpan]="12">
              <nz-form-item>
                <nz-form-label>Email doanh nghiệp</nz-form-label>
                <nz-form-control>
                  <input
                    nz-input
                    formControlName="businessEmail"
                    placeholder="Nhập email" />
                  <div class="mt-1">
                    <nz-tag *ngIf="emailVerificationStatus.isVerified" nzColor="green">Đã xác minh</nz-tag>
                    <nz-tag *ngIf="!emailVerificationStatus.isVerified" nzColor="red">Chưa xác minh</nz-tag>
                  </div>
                </nz-form-control>
              </nz-form-item>
            </nz-col>
          </nz-row>

          <div class="text-right mt-3">
            <button
              nz-button
              nzType="primary"
              [disabled]="emailVerificationStatus.isVerified"
              (click)="saveBusinessInfo()">
              Lưu thay đổi
            </button>

          </div>
        </form>
      </nz-card>
    </nz-tab>

    <!-- TAB 2: SMTP -->
    <nz-tab nzTitle="Cấu hình SMTP">
      <nz-card [nzSize]="'default'">
        <nz-form-item>
          <nz-form-label>Dùng Custom SMTP</nz-form-label>
          <nz-form-control>
            <nz-switch
              [(ngModel)]="useCustomSmtp"
              name="useCustomSmtp"
              (ngModelChange)="onToggleCustomSmtp($event)">
            </nz-switch>
            <div class="text-xs text-gray-500 mt-1">Tắt để sử dụng SMTP mặc định của hệ thống</div>
          </nz-form-control>
        </nz-form-item>

        <form *ngIf="isSmtpFormVisible()" [formGroup]="smtpForm" nz-form [nzLayout]="'vertical'">

          <nz-form-label>Tên nhà cung cấp (Provider)</nz-form-label>
          <nz-form-control>
            <input nz-input formControlName="provider" placeholder="VD: Gmail, Sendinblue, Outlook..." />
          </nz-form-control>

          <nz-form-item>
            <nz-form-label>SMTP Host</nz-form-label>
            <nz-form-control>
              <input nz-input formControlName="smtpServer" placeholder="smtp.example.com" />
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-label>SMTP Port</nz-form-label>
            <nz-form-control>
              <input nz-input formControlName="smtpPort" type="number" placeholder="587" />
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-label>Tên đăng nhập</nz-form-label>
            <nz-form-control>
              <input nz-input formControlName="username" placeholder="user@example.com" />
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-label>Mật khẩu</nz-form-label>
            <nz-form-control>
              <input nz-input formControlName="password" type="password" placeholder="••••••••" />
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-control>
              <button nz-button (click)="onTestSmtp()">Kiểm tra kết nối</button>
              <button nz-button nzType="primary" class="ml-2" (click)="saveSmtpSetting()">
                Lưu cấu hình
              </button>
            </nz-form-control>
          </nz-form-item>
        </form>

        <div *ngIf="!useCustomSmtp" class="mt-4 text-sm text-gray-500 italic">
          Bạn đang sử dụng <strong>SMTP mặc định</strong> của hệ thống để gửi email.
        </div>
      </nz-card>
    </nz-tab>

    <!-- TAB 3: Đổi mật khẩu -->
    <nz-tab nzTitle="Đổi mật khẩu">
      <nz-card [nzSize]="'default'">
        <form [formGroup]="passwordForm" nz-form [nzLayout]="'vertical'">
          <nz-form-item>
            <nz-form-label>Mật khẩu cũ</nz-form-label>
            <nz-form-control>
              <input nz-input type="password" formControlName="oldPassword" placeholder="Nhập mật khẩu cũ" />
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-label>Mật khẩu mới</nz-form-label>
            <nz-form-control>
              <input nz-input type="password" formControlName="newPassword" placeholder="Nhập mật khẩu mới" />
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-label>Nhập lại mật khẩu</nz-form-label>
            <nz-form-control>
              <input nz-input type="password" formControlName="confirmPassword" placeholder="Nhập lại mật khẩu mới" />
            </nz-form-control>
          </nz-form-item>

          <div class="text-right mt-3">
            <button nz-button nzType="primary" (click)="changePassword()">Đổi mật khẩu</button>
          </div>
        </form>
      </nz-card>
    </nz-tab>
  </nz-tabset>
</div>
