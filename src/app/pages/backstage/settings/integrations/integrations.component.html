<div class="settings-wrapper">
  <h2 class="mb-4">Integration Settings</h2>

  <nz-card nzTitle="KNACK Integration" class="mb-4">
    <!-- ✅ Switch nằm trong card body -->
    <div class="mb-3">
      <label class="font-bold mr-2">Trạng thái:</label>

      <nz-switch
        [(ngModel)]="isKnackEnabled"
        [nzCheckedChildren]="'ON'"
        [nzUnCheckedChildren]="'OFF'"
        (ngModelChange)="toggleKnackStatus($event)"
      ></nz-switch>

    </div>

    <!-- ✅ KHÔNG dùng [nzDisabled] nữa -->
    <form *ngIf="isKnackEnabled" [formGroup]="knackForm">
      <div class="grid-form">
        <nz-form-item>
          <nz-form-label [nzSpan]="6" nzRequired>Endpoint URL</nz-form-label>
          <nz-form-control [nzSpan]="18">
            <input nz-input formControlName="endpointUrl" />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label [nzSpan]="6" nzRequired>Username</nz-form-label>
          <nz-form-control [nzSpan]="18">
            <input nz-input formControlName="username" />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label [nzSpan]="6" nzRequired >Password</nz-form-label>
          <nz-form-control [nzSpan]="18">
            <input nz-input type="password" formControlName="password" />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label [nzSpan]="6" nzRequired>Tag ID</nz-form-label>
          <nz-form-control [nzSpan]="18">
            <input nz-input type="number" formControlName="tagId" />
          </nz-form-control>
        </nz-form-item>

        <div class="text-right">
          <button nz-button (click)="testKnackConnection()" [disabled]="knackForm.disabled">Test Connection</button>
          <button nz-button nzType="primary" (click)="saveKnackIntegration()" [disabled]="knackForm.disabled">Save</button>
          <button nz-button class="pull-btn" (click)="pullKnackData()" [disabled]="!canPullKnack()">Pull</button>
          <button nz-button class="pull-all-btn" (click)="pullAllKnackData()" [disabled]="!canPullKnack()" >Pull All</button>
        </div>
      </div>
    </form>
  </nz-card>



</div>
